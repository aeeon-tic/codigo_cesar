<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Missões Secretas — Código de César</title>
  <style>
    :root{--bg:#f6f8fc;--card:#fff;--panel:#eef2f7;--text:#1f2937;--muted:#6b7280;--border:#dbe2ea;--accent:#5b5ce2}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:960px;margin:auto;padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px}
    .top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.badge{background:var(--panel);padding:10px 14px;border-radius:14px;text-align:center}
    .score{font-size:24px;font-weight:800}.small{font-size:13px;color:var(--muted)}.bar-bg{height:10px;background:var(--panel);border-radius:999px;overflow:hidden;margin-top:14px}.bar{height:100%;background:var(--accent);width:10%;transition:width .3s}
    .cipher{overflow-x:auto;background:var(--panel);border-radius:14px;padding:14px;margin-top:10px}.cipher-row{display:grid;grid-template-columns:80px 1fr;gap:8px;min-width:680px;font-family:Consolas,monospace}.letters{letter-spacing:.18em}
    .game{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}.visual{min-height:180px;background:var(--panel);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:84px}.challenge{font-size:clamp(32px,7vw,52px);font-weight:900;letter-spacing:.06em;margin:8px 0 14px}
    label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;min-height:52px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:0 14px;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}input:focus{outline:3px solid #c7d2fe;border-color:var(--accent)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{min-height:46px;border-radius:12px;border:1px solid var(--border);padding:0 18px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.feedback{min-height:28px;margin-top:12px;font-weight:800}.finish{text-align:center;display:none}.stars{font-size:34px;margin:10px 0}
    @media (max-width:700px){.wrap{padding:14px}.game{grid-template-columns:1fr}.visual{min-height:150px}}
  </style>
</head>
<body>
<main class="wrap" id="secret-missions">
  <h1>Mensagens Secretas</h1>
  <p class="small">Código de César — 5 desafios de codificar e 5 de descodificar</p>
  <section class="card">
    <div class="top"><div><div id="phase" class="small" style="font-weight:800">Codificar</div><div id="progress" style="font-size:22px;font-weight:900">Missão 1 de 10</div></div><div class="badge"><div class="small" style="font-weight:800">PONTOS</div><div id="score" class="score">0</div></div></div>
    <div class="bar-bg"><div id="bar" class="bar"></div></div>
  </section>
  <section class="card">
    <div class="top"><strong>Cifra de César</strong><span class="small">N → A</span></div>
    <div class="cipher" aria-label="Tabela da cifra de César"><div class="cipher-row"><strong>Normal</strong><span class="letters">ABCDEFGHIJKLMNOPQRSTUVWXYZ</span></div><div class="cipher-row"><strong>Código</strong><span class="letters">NOPQRSTUVWXYZABCDEFGHIJKLM</span></div></div>
  </section>
  <section class="card" id="task">
    <div class="game"><div id="visual" class="visual" aria-label="Imagem do desafio">🐱</div><div><div id="instruction" class="small" style="font-weight:800">Codifica a palavra representada pela imagem.</div><div id="challenge" class="challenge">GATO</div><form id="answer-form"><label for="answer">Escreve a resposta:</label><input id="answer" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Escreve aqui"/><div class="actions"><button type="submit" class="primary">Verificar</button><button id="restart" type="button">Novo jogo</button></div></form><div id="feedback" class="feedback" aria-live="polite"></div></div></div>
  </section>
  <section class="card finish" id="finish"><div style="font-size:64px">🏆</div><h2>Missões concluídas!</h2><p id="final-score" style="font-size:20px;font-weight:800"></p><div id="stars" class="stars" aria-label="Estrelas obtidas"></div><button id="play-again" type="button" class="primary">Jogar novamente</button></section>
</main>
<script>
(()=>{const root=document.getElementById('secret-missions');
const encodeBank=[{word:'GATO',icon:'🐱'},{word:'CASA',icon:'🏠'},{word:'BOLA',icon:'⚽'},{word:'SOL',icon:'☀️'},{word:'LUA',icon:'🌙'},{word:'FLOR',icon:'🌷'},{word:'PEIXE',icon:'🐟'},{word:'LIVRO',icon:'📘'},{word:'BARCO',icon:'⛵'},{word:'FOGUETE',icon:'🚀'},{word:'PATO',icon:'🦆'},{word:'BOLO',icon:'🎂'},{word:'PIZZA',icon:'🍕'},{word:'ESTRELA',icon:'⭐'},{word:'ARVORE',icon:'🌳'}];
const decodeBank=[{word:'CAO',icon:'🐶'},{word:'RATO',icon:'🐭'},{word:'SAPO',icon:'🐸'},{word:'URSO',icon:'🐻'},{word:'CARRO',icon:'🚗'},{word:'ESCOLA',icon:'🏫'},{word:'LAPIS',icon:'✏️'},{word:'MALA',icon:'🧳'},{word:'PERA',icon:'🍐'},{word:'UVA',icon:'🍇'},{word:'TULIPA',icon:'🌷'},{word:'NUVEM',icon:'☁️'},{word:'CHAVE',icon:'🔑'},{word:'CAVALO',icon:'🐴'},{word:'GELADO',icon:'🍦'}];
const phaseEl=root.querySelector('#phase'),progressEl=root.querySelector('#progress'),scoreEl=root.querySelector('#score'),barEl=root.querySelector('#bar'),visualEl=root.querySelector('#visual'),instructionEl=root.querySelector('#instruction'),challengeEl=root.querySelector('#challenge'),form=root.querySelector('#answer-form'),answerEl=root.querySelector('#answer'),feedbackEl=root.querySelector('#feedback'),taskEl=root.querySelector('#task'),finishEl=root.querySelector('#finish'),finalScoreEl=root.querySelector('#final-score'),starsEl=root.querySelector('#stars');let missions=[],index=0,score=0,attempts=0,locked=false;
function rot13(text){return text.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode(((c.charCodeAt(0)-65+13)%26)+65))}
function normalize(text){return text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'')}
function pickFive(bank){const copy=[...bank];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy.slice(0,5)}
function newGame(){const enc=pickFive(encodeBank).map(x=>({...x,type:'encode'}));const dec=pickFive(decodeBank).map(x=>({...x,type:'decode'}));missions=[...enc,...dec];index=0;score=0;attempts=0;locked=false;scoreEl.textContent='0';taskEl.style.display='';finishEl.style.display='none';renderMission()}
function renderMission(){const m=missions[index];attempts=0;locked=false;feedbackEl.textContent='';answerEl.value='';progressEl.textContent=`Missão ${index+1} de ${missions.length}`;barEl.style.width=`${((index+1)/missions.length)*100}%`;if(m.type==='encode'){phaseEl.textContent='Codificar · desafio '+(index+1)+' de 5';instructionEl.textContent='Codifica a palavra representada pela imagem.';visualEl.textContent=m.icon;visualEl.setAttribute('aria-label',`Imagem: ${m.word}`);challengeEl.textContent=m.word;answerEl.placeholder='Escreve o código'}else{phaseEl.textContent='Descodificar · desafio '+(index-4)+' de 5';instructionEl.textContent='Descodifica a mensagem secreta.';visualEl.textContent='🔐';visualEl.setAttribute('aria-label','Mensagem secreta para descodificar');challengeEl.textContent=rot13(m.word);answerEl.placeholder='Escreve a palavra'}answerEl.focus()}
function pointsForAttempt(n){if(n===1)return 100;if(n===2)return 70;if(n===3)return 40;return 20}
form.addEventListener('submit',e=>{e.preventDefault();if(locked)return;const m=missions[index],response=normalize(answerEl.value);if(!response){feedbackEl.textContent='Escreve uma resposta antes de verificar.';answerEl.focus();return}attempts+=1;const correct=m.type==='encode'?rot13(m.word):m.word;if(response===normalize(correct)){locked=true;const pts=pointsForAttempt(attempts);score+=pts;scoreEl.textContent=String(score);feedbackEl.textContent=`Muito bem! +${pts} pontos`;if(m.type==='decode'){visualEl.textContent=m.icon;visualEl.setAttribute('aria-label',`Imagem: ${m.word}`)}setTimeout(()=>{index+=1;if(index>=missions.length)finishGame();else renderMission()},900)}else{if(attempts===1)feedbackEl.textContent='Ainda não está certo. Consulta a cifra e tenta novamente.';else if(attempts===2)feedbackEl.textContent='Quase! Verifica cada letra com atenção.';else feedbackEl.textContent='Tenta outra vez. Compara letra a letra com a cifra.';answerEl.select()}});
function finishGame(){taskEl.style.display='none';finishEl.style.display='block';finalScoreEl.textContent=`Conseguiste ${score} pontos em 1000.`;const stars=score>=850?3:score>=650?2:1;starsEl.textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars)}
root.querySelector('#restart').addEventListener('click',newGame);root.querySelector('#play-again').addEventListener('click',newGame);newGame()})();
</script>
</body>
</html>
