<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Missões Secretas — Código de César</title>
  <style>
    :root{--bg:#f6f8fc;--card:#fff;--panel:#eef2f7;--text:#1f2937;--muted:#6b7280;--border:#dbe2ea;--accent:#5b5ce2}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:920px;margin:auto;padding:14px 18px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
    .hero{background:linear-gradient(135deg,#0f4fbf 0%,#1565d8 52%,#1f7aff 100%);border:1px solid #0b4aa8;border-radius:20px;padding:9px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:center;overflow:hidden}
    .hero h1{margin:0 0 2px;font-size:clamp(28px,4.5vw,40px);color:#ffd84d;text-shadow:0 1px 0 rgba(0,0,0,.15)}
    .hero .small{font-size:14px;margin:0;color:#ffe680;font-weight:700}
    .secret-art{position:relative;height:88px;display:flex;align-items:center;justify-content:center}
    .caesar-robot{position:relative;width:150px;height:82px;display:flex;align-items:center;justify-content:center}
    .robot-head{position:relative;width:74px;height:58px;background:linear-gradient(180deg,#ffd84d,#ffcc1a);border:3px solid #0f3d91;border-radius:18px;box-shadow:0 8px 16px rgba(15,79,191,.18)}
    .robot-head:before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-14px;width:5px;height:14px;background:#0f3d91;border-radius:4px}
    .robot-head:after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-22px;width:14px;height:14px;background:#ff8c00;border:2px solid #0f3d91;border-radius:50%}
    .robot-eye{position:absolute;top:17px;width:13px;height:13px;background:#1e88ff;border:2px solid #0f3d91;border-radius:50%;box-shadow:inset 0 0 0 2px #93c5fd}
    .robot-eye.left{left:14px}
    .robot-eye.right{right:14px}
    .robot-cheek{position:absolute;top:34px;width:10px;height:6px;background:#f59e0b;border-radius:999px;opacity:.9}
    .robot-cheek.left{left:12px}
    .robot-cheek.right{right:12px}
    .robot-mouth{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:28px;height:10px;border:3px solid #0f3d91;border-top:none;border-radius:0 0 14px 14px}
    .robot-ear{position:absolute;top:20px;width:10px;height:18px;background:#1e88ff;border:2px solid #0f3d91;border-radius:8px}
    .robot-ear.left{left:-9px}
    .robot-ear.right{right:-9px}
    .laurel{position:absolute;top:-14px;width:92px;height:34px;pointer-events:none}
    .leaf{position:absolute;width:10px;height:16px;background:#2fbf71;border:2px solid #0f8a4b;border-radius:10px 10px 10px 0}
    .leaf.left{transform:rotate(-35deg)}
    .leaf.right{transform:scaleX(-1) rotate(-35deg)}
    .stem{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:10px;height:8px;border-top:3px solid #0f8a4b;border-radius:999px}


    .envelope{position:absolute;right:34px;top:18px;width:145px;height:66px;background:#ffe082;border:3px solid #f59e0b;border-radius:11px;box-shadow:0 6px 14px rgba(31,41,55,.16)}
    .envelope:before,.envelope:after{content:"";position:absolute;top:0;width:0;height:0;border-style:solid}
    .envelope:before{left:0;border-width:31px 70px 0 0;border-color:#ffca28 transparent transparent transparent}
    .envelope:after{right:0;border-width:31px 0 0 70px;border-color:#42a5f5 transparent transparent transparent}
    .paper{position:absolute;right:53px;top:0;width:108px;height:49px;background:#fff8c6;border:2px solid #f59e0b;border-radius:8px;padding:5px 7px;font-family:Consolas,monospace;font-weight:800;font-size:10px;line-height:1.25;color:#0f3d91;transform:rotate(-3deg);box-shadow:0 5px 10px rgba(31,41,55,.12)}
    .lock{position:absolute;right:6px;bottom:0;width:44px;height:44px;background:#0f4fbf;border:2px solid #ffd84d;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 5px 11px rgba(15,79,191,.35)}
    .badge-mini{position:absolute;left:6px;bottom:4px;background:#ffd84d;border:2px solid #f59e0b;border-radius:999px;padding:4px 9px;font-weight:900;color:#0f3d91;font-size:10px;transform:rotate(-6deg)}
    .top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.badge{background:var(--panel);padding:10px 14px;border-radius:14px;text-align:center}
    .score{font-size:22px;font-weight:800}.small{font-size:13px;color:var(--muted)}.bar-bg{height:10px;background:var(--panel);border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:10%;transition:width .3s}
    .cipher{overflow-x:auto;background:var(--panel);border-radius:14px;padding:10px 12px;margin-top:8px}.cipher-row{display:grid;grid-template-columns:80px 1fr;gap:8px;min-width:680px;font-family:Consolas,monospace}.letters{letter-spacing:.18em;font-weight:900}.letters span{display:inline-block}
    .letters.normal span{color:#1e88ff}
    .letters.code span{color:#eab308}
    .game{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center}.visual{min-height:155px;background:var(--panel);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:76px}.challenge{font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:.06em;margin:6px 0 10px}
    label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;min-height:52px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:0 14px;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}input:focus{outline:3px solid #c7d2fe;border-color:var(--accent)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{min-height:46px;border-radius:12px;border:1px solid var(--border);padding:0 18px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.feedback{min-height:28px;margin-top:12px;font-weight:800}.finish{text-align:center;display:none}.stars{font-size:34px;margin:10px 0}
    @media (max-width:700px){.wrap{padding:10px}.hero{grid-template-columns:1fr;padding:10px 12px}.secret-art{height:86px}.caesar-robot{transform:scale(.9)}.game{grid-template-columns:1fr}.visual{min-height:135px}}
  </style>
</head>
<body>
<main class="wrap" id="secret-missions">
  <section class="hero">
    <div>
      <h1>Mensagens Secretas</h1>
      <p class="small">Código de César</p>
    </div>
    <div class="secret-art" aria-label="Ilustração do César em versão robô">
      <div class="caesar-robot">
        <div class="laurel" aria-hidden="true">
          <div class="leaf left" style="left:10px; top:14px;"></div>
          <div class="leaf left" style="left:18px; top:8px;"></div>
          <div class="leaf left" style="left:28px; top:4px;"></div>
          <div class="leaf left" style="left:40px; top:1px;"></div>
          <div class="leaf right" style="right:10px; top:14px;"></div>
          <div class="leaf right" style="right:18px; top:8px;"></div>
          <div class="leaf right" style="right:28px; top:4px;"></div>
          <div class="leaf right" style="right:40px; top:1px;"></div>
          <div class="stem"></div>
        </div>
        <div class="robot-head">
          <div class="robot-ear left"></div>
          <div class="robot-ear right"></div>
          <div class="robot-eye left"></div>
          <div class="robot-eye right"></div>
          <div class="robot-cheek left"></div>
          <div class="robot-cheek right"></div>
          <div class="robot-mouth"></div>
        </div>
      </div>
    </div>
  </section>
  <section class="card">
    <div class="top"><div><div id="phase" class="small" style="font-weight:800">Codificar</div><div id="progress" style="font-size:22px;font-weight:900">Missão 1 de 10</div></div><div class="badge"><div class="small" style="font-weight:800">PONTOS</div><div id="score" class="score">0</div></div></div>
    <div class="bar-bg"><div id="bar" class="bar"></div></div>
  </section>
  <section class="card">
    <div class="top"><strong>Código de César</strong><span class="small">N → A</span></div>
    <div class="cipher" aria-label="Tabela da cifra de César"><div class="cipher-row"><strong>Normal</strong><span class="letters normal"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span><span>L</span><span>M</span><span>N</span><span>O</span><span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span><span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span><span>Z</span></span></div><div class="cipher-row"><strong>Código</strong><span class="letters code"><span>N</span><span>O</span><span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span><span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span><span>Z</span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span><span>L</span><span>M</span></span></div></div>
  </section>
  <section class="card" id="task">
    <div class="game"><div id="visual" class="visual" aria-label="Imagem do desafio">🐱</div><div><div id="instruction" class="small" style="font-weight:800">Codifica a palavra representada pela imagem.</div><div id="challenge" class="challenge">GATO</div><form id="answer-form"><label for="answer">Escreve a resposta:</label><input id="answer" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Escreve aqui"/><div class="actions"><button type="submit" class="primary">Verificar</button><button id="restart" type="button">Novo jogo</button></div></form><div id="feedback" class="feedback" aria-live="polite"></div></div></div>
  </section>
  <section class="card finish" id="finish"><div style="font-size:64px">🏆</div><h2>Missões concluídas!</h2><p id="final-score" style="font-size:20px;font-weight:800"></p><div id="stars" class="stars" aria-label="Estrelas obtidas"></div><button id="play-again" type="button" class="primary">Jogar novamente</button></section>
  <div class="footer">Professor <strong>António João Lopes</strong></div>
</main>
<script>
(()=>{const root=document.getElementById('secret-missions');
const encodeBank=[{word:'GATO',icon:'🐱'},{word:'CASA',icon:'🏠'},{word:'BOLA',icon:'⚽'},{word:'SOL',icon:'☀️'},{word:'LUA',icon:'🌙'},{word:'FLOR',icon:'🌷'},{word:'PEIXE',icon:'🐟'},{word:'LIVRO',icon:'📘'},{word:'BARCO',icon:'⛵'},{word:'FOGUETE',icon:'🚀'},{word:'PATO',icon:'🦆'},{word:'BOLO',icon:'🎂'},{word:'PIZZA',icon:'🍕'},{word:'ESTRELA',icon:'⭐'},{word:'ARVORE',icon:'🌳'}];
const decodeBank=[{word:'CAO',icon:'🐶'},{word:'RATO',icon:'🐭'},{word:'SAPO',icon:'🐸'},{word:'URSO',icon:'🐻'},{word:'CARRO',icon:'🚗'},{word:'ESCOLA',icon:'🏫'},{word:'LAPIS',icon:'✏️'},{word:'MALA',icon:'🧳'},{word:'PERA',icon:'🍐'},{word:'UVA',icon:'🍇'},{word:'TULIPA',icon:'🌷'},{word:'NUVEM',icon:'☁️'},{word:'CHAVE',icon:'🔑'},{word:'CAVALO',icon:'🐴'},{word:'GELADO',icon:'🍦'}];
const phaseEl=root.querySelector('#phase'),progressEl=root.querySelector('#progress'),scoreEl=root.querySelector('#score'),barEl=root.querySelector('#bar'),visualEl=root.querySelector('#visual'),instructionEl=root.querySelector('#instruction'),challengeEl=root.querySelector('#challenge'),form=root.querySelector('#answer-form'),answerEl=root.querySelector('#answer'),feedbackEl=root.querySelector('#feedback'),taskEl=root.querySelector('#task'),finishEl=root.querySelector('#finish'),finalScoreEl=root.querySelector('#final-score'),starsEl=root.querySelector('#stars');let missions=[],index=0,score=0,attempts=0,locked=false;
function rot13(text){return text.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode(((c.charCodeAt(0)-65+13)%26)+65))}
function normalize(text){return text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'')}
function pickFive(bank){const copy=[...bank];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy.slice(0,5)}
function newGame(){const enc=pickFive(encodeBank).map(x=>({...x,type:'encode'}));const dec=pickFive(decodeBank).map(x=>({...x,type:'decode'}));missions=[...enc,...dec];index=0;score=0;attempts=0;locked=false;scoreEl.textContent='0';taskEl.style.display='';finishEl.style.display='none';renderMission()}
function renderMission(){const m=missions[index];attempts=0;locked=false;feedbackEl.textContent='';answerEl.value='';progressEl.textContent=`Missão ${index+1} de ${missions.length}`;barEl.style.width=`${((index+1)/missions.length)*100}%`;if(m.type==='encode'){phaseEl.textContent='Codificar · desafio '+(index+1)+' de 5';instructionEl.textContent='Codifica a palavra representada pela imagem.';visualEl.textContent=m.icon;visualEl.setAttribute('aria-label',`Imagem: ${m.word}`);challengeEl.textContent=m.word;answerEl.placeholder='Escreve o código'}else{phaseEl.textContent='Descodificar · desafio '+(index-4)+' de 5';instructionEl.textContent='Descodifica a mensagem secreta.';visualEl.textContent='🔐';visualEl.setAttribute('aria-label','Mensagem secreta para descodificar');challengeEl.textContent=rot13(m.word);answerEl.placeholder='Escreve a palavra'}answerEl.focus()}
function pointsForAttempt(n){if(n===1)return 100;if(n===2)return 70;if(n===3)return 40;return 20}
form.addEventListener('submit',e=>{e.preventDefault();if(locked)return;const m=missions[index],response=normalize(answerEl.value);if(!response){feedbackEl.textContent='Escreve uma resposta antes de verificar.';answerEl.focus();return}attempts+=1;const correct=m.type==='encode'?rot13(m.word):m.word;if(response===normalize(correct)){locked=true;const pts=pointsForAttempt(attempts);score+=pts;scoreEl.textContent=String(score);feedbackEl.textContent=`Muito bem! +${pts} pontos`;if(m.type==='decode'){visualEl.textContent=m.icon;visualEl.setAttribute('aria-label',`Imagem: ${m.word}`)}setTimeout(()=>{index+=1;if(index>=missions.length)finishGame();else renderMission()},900)}else{if(attempts===1)feedbackEl.textContent='Ainda não está certo. Consulta a cifra e tenta novamente.';else if(attempts===2)feedbackEl.textContent='Quase! Verifica cada letra com atenção.';else feedbackEl.textContent='Tenta outra vez. Compara letra a letra com a cifra.';answerEl.select()}});
function finishGame(){taskEl.style.display='none';finishEl.style.display='block';finalScoreEl.textContent=`Conseguiste ${score} pontos em 1000.`;const stars=score>=850?3:score>=650?2:1;starsEl.textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars)}
root.querySelector('#restart').addEventListener('click',newGame);root.querySelector('#play-again').addEventListener('click',newGame);newGame()})();
</script>
</body>
</html>
